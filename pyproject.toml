[project]
name = "intake"
version = "0.1.0"
description = "Answer-level coverage tracking for mandated professional interviews"
requires-python = ">=3.11"
dependencies = [
    "google-genai==1.50.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
