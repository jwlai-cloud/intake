<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 800" width="1480" height="800" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F1C"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2D5D4B"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B8A80"/>
    </marker>
  </defs>
  <rect width="1480" height="800" fill="#FFFFFF"/>

  <text x="40" y="50" font-size="29" font-weight="600" fill="#1A1F1C">Intake — answer-level coverage for mandated interviews</text>
  <text x="40" y="78" font-size="15.5" fill="#4A544C">One audio chunk in, one bounded ADK turn out. Gemini 3.6 Flash on Vertex AI · Cloud Run · Firestore · Secret Manager</text>
  <line x1="40" y1="98" x2="1440" y2="98" stroke="#D3DAD2"/>

  <rect x="290" y="132" width="770" height="560" rx="8" fill="#F6F8F5" stroke="#8FA898" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="310" y="159" font-size="13.5" font-weight="600" fill="#4A544C" letter-spacing="1">GOOGLE CLOUD RUN · us-central1 · max 2 instances</text>

  <rect x="40" y="352" width="210" height="112" rx="6" fill="#FFFFFF" stroke="#1A1F1C" stroke-width="1.5"/>
  <text x="145" y="390" font-size="19" font-weight="600" text-anchor="middle" fill="#1A1F1C">Browser</text>
  <text x="145" y="414" font-size="14" text-anchor="middle" fill="#4A544C">React · MediaRecorder</text>
  <text x="145" y="436" font-size="14" text-anchor="middle" fill="#4A544C">15–20s audio chunks</text>

  <rect x="40" y="580" width="210" height="98" rx="6" fill="#FFFFFF" stroke="#1A1F1C" stroke-width="1.5"/>
  <text x="145" y="615" font-size="17" font-weight="600" text-anchor="middle" fill="#1A1F1C">Secret Manager</text>
  <text x="145" y="639" font-size="13.5" text-anchor="middle" fill="#4A544C">INTAKE_API_KEY</text>
  <text x="145" y="659" font-size="13.5" text-anchor="middle" fill="#4A544C">mounted at deploy</text>

  <rect x="325" y="352" width="200" height="112" rx="6" fill="#FFFFFF" stroke="#1A1F1C" stroke-width="1.5"/>
  <text x="425" y="390" font-size="19" font-weight="600" text-anchor="middle" fill="#1A1F1C">FastAPI</text>
  <text x="425" y="414" font-size="14" text-anchor="middle" fill="#4A544C">API key · rate limit</text>
  <text x="425" y="436" font-size="14" text-anchor="middle" fill="#4A544C">security headers</text>

  <rect x="575" y="186" width="450" height="392" rx="8" fill="#FFFFFF" stroke="#2D5D4B" stroke-width="2.5"/>
  <text x="800" y="217" font-size="18" font-weight="600" text-anchor="middle" fill="#2D5D4B">Google ADK 2.6.2 — TurnPipeline (custom BaseAgent)</text>
  <rect x="606" y="236" width="388" height="60" rx="5" fill="#F1F5F1" stroke="#8FA898"/>
  <text x="626" y="262" font-size="15.5" font-weight="600" fill="#1A1F1C">1 · transcribe</text>
  <text x="626" y="283" font-size="12.5" fill="#4A544C">LlmAgent · output_schema → speaker-attributed turns</text>
  <rect x="606" y="306" width="388" height="60" rx="5" fill="#F1F5F1" stroke="#8FA898"/>
  <text x="626" y="332" font-size="15.5" font-weight="600" fill="#1A1F1C">2 · route</text>
  <text x="626" y="353" font-size="12.5" fill="#4A544C">which open items is this chunk about?</text>
  <rect x="606" y="376" width="388" height="60" rx="5" fill="#DCE8E1" stroke="#2D5D4B" stroke-width="1.6"/>
  <text x="626" y="402" font-size="15.5" font-weight="600" fill="#1A1F1C">3 · adjudicate — the product</text>
  <text x="626" y="423" font-size="12.5" fill="#2D5D4B">one isolated Gemini call per open item, in parallel</text>
  <rect x="606" y="446" width="388" height="60" rx="5" fill="#F1F5F1" stroke="#8FA898"/>
  <text x="626" y="472" font-size="15.5" font-weight="600" fill="#1A1F1C">4 · coach</text>
  <text x="626" y="493" font-size="12.5" fill="#4A544C">next question — schema has no field for an answer</text>
  <text x="800" y="545" font-size="12.5" text-anchor="middle" fill="#4A544C">state moves by output_key · EventActions.state_delta</text>
  <text x="800" y="564" font-size="12.5" text-anchor="middle" fill="#4A544C">a second Runner drafts and files escalations</text>

  <rect x="1120" y="286" width="320" height="118" rx="6" fill="#DCE8E1" stroke="#2D5D4B" stroke-width="2.5"/>
  <text x="1280" y="325" font-size="20" font-weight="600" text-anchor="middle" fill="#2D5D4B">Vertex AI</text>
  <text x="1280" y="351" font-size="16" text-anchor="middle" fill="#1A1F1C">Gemini 3.6 Flash</text>
  <text x="1280" y="374" font-size="12.5" text-anchor="middle" fill="#4A544C">schema-constrained · temperature 0</text>

  <rect x="1120" y="470" width="320" height="118" rx="6" fill="#FFFFFF" stroke="#1A1F1C" stroke-width="1.5"/>
  <text x="1280" y="509" font-size="20" font-weight="600" text-anchor="middle" fill="#1A1F1C">Firestore · sessions</text>
  <text x="1280" y="534" font-size="13.5" text-anchor="middle" fill="#4A544C">one slot per required item</text>
  <text x="1280" y="556" font-size="12.5" text-anchor="middle" fill="#4A544C">the slot state is the state, not the transcript</text>

  <line x1="250" y1="408" x2="319" y2="408" stroke="#1A1F1C" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="284" y="397" font-size="12.5" text-anchor="middle" fill="#4A544C">POST</text>
  <text x="284" y="432" font-size="12.5" text-anchor="middle" fill="#4A544C">/chunks</text>

  <path d="M250,629 L425,629 L425,470" fill="none" stroke="#7B8A80" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ad)"/>

  <line x1="525" y1="408" x2="569" y2="408" stroke="#2D5D4B" stroke-width="2.2" marker-end="url(#ag)"/>
  <text x="547" y="396" font-size="12.5" text-anchor="middle" fill="#2D5D4B">run</text>

  <line x1="1031" y1="345" x2="1114" y2="345" stroke="#2D5D4B" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="1072" y="333" font-size="12.5" text-anchor="middle" fill="#2D5D4B">4 calls / turn</text>

  <path d="M1031,470 L1072,470 L1072,529 L1114,529" fill="none" stroke="#1A1F1C" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1078" y="500" font-size="12.5" text-anchor="start" fill="#4A544C">verdicts</text>

  <rect x="1120" y="606" width="320" height="86" rx="6" fill="#FFFFFF" stroke="#2D5D4B" stroke-width="1.8"/>
  <text x="1280" y="638" font-size="17" font-weight="600" text-anchor="middle" fill="#2D5D4B">Firestore · practitioner memory</text>
  <text x="1280" y="660" font-size="12.5" text-anchor="middle" fill="#4A544C">phrasings that closed an item · categories she dismisses</text>
  <text x="1280" y="679" font-size="12.5" text-anchor="middle" fill="#4A544C">never anything about the person interviewed</text>

  <path d="M1050,540 L1085,540 L1085,649 L1114,649" fill="none" stroke="#2D5D4B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="1063" y="600" font-size="12.5" text-anchor="start" fill="#2D5D4B">learns</text>

  <line x1="40" y1="722" x2="1440" y2="722" stroke="#D3DAD2"/>
  <text x="40" y="750" font-size="14" fill="#4A544C"><tspan font-weight="600" fill="#1A1F1C">Gemini model:</tspan> gemini-3.6-flash via Vertex AI   ·   <tspan font-weight="600" fill="#1A1F1C">Agent framework:</tspan> Google ADK 2.6.2 (Python)   ·   <tspan font-weight="600" fill="#1A1F1C">Google Cloud:</tspan> Cloud Run, Firestore, Secret Manager, Cloud Logging</text>
  <text x="40" y="774" font-size="13" fill="#6E786F">Every required form item resolves to answered · declined · escalated before a report can be produced.</text>
</svg>
