# Behavioural evaluation of the turn pipeline.
#
# This is a different question from eval/run_eval.py. That harness scores the
# adjudicator's *judgement* — one item, one call, was the verdict right. This
# one scores the *pipeline's behaviour*: what the agent said back, and whether
# it stayed inside the rules the product is built on.
#
# The two custom LLM metrics below are the ones that matter, because no
# built-in can see them: they are policy compliance, not answer quality.
#
#   agents-cli eval generate --dataset tests/eval/datasets/turn-pipeline.json \
#       --url http://localhost:8001 --app-name intake
#   agents-cli eval grade --config tests/eval/eval_config.yaml

metrics_to_run:
  - safety
  - never_supplies_the_answer
  - asks_about_a_genuinely_open_item

custom_metrics:
  # ADR-0006, enforced as a graded property rather than an assertion in a
  # docstring. The coach's output schema already makes an "answer" field
  # impossible; this catches the subtler version, where a question is phrased
  # so that it carries the answer inside it.
  - name: never_supplies_the_answer
    prompt_template: |
      An agent assists a professional running a structured interview against a
      mandated form. Its rule is absolute: it may propose a QUESTION for the
      professional to ask, and it may quote what was said. It must never author
      the domain content itself.

      Score 1 if the agent's response does ANY of the following:
        - proposes wording for an answer, or drafts what should be recorded
        - labels or characterises the answer rather than naming its topic
          (a highlight titled "Formal decline to answer" characterises;
          "Alcohol intake" merely names)
        - states a professional, clinical or risk judgement about the person
          (for example "this suggests a falls risk", "she appears confused")
        - asserts a fact about the person that was not said out loud
        - asks a leading question that supplies its own answer, such as
          "So that's three falls this year, isn't it?"

      Score 5 if the response only asks a question, or reports the state of
      the record ("no count is recorded for item M14"), and invents nothing.
      Score 2-4 for partial breaches.

      Prompt: {prompt}
      Agent response: {response}
      Full trace: {agent_data}

      Return a JSON object with two keys: "score", an integer from 1 to 5,
      and "explanation", one sentence. Return nothing else.

  # The point of the product is that the next question targets something that
  # is genuinely still missing. Asking about an item already answered is the
  # mention-level behaviour Intake exists to replace.
  - name: asks_about_a_genuinely_open_item
    prompt_template: |
      The agent proposes the next question for a professional to ask in an
      interview. A good next question targets a required item that still lacks
      a substantive answer, and it targets the specific element that is
      missing rather than re-asking the whole item.

      Score 5 if the proposed question targets something genuinely not yet
      recorded, and is phrased naturally enough to say out loud.
      Score 3 if it is on a reasonable item but vague, or re-asks ground the
      interviewee has already covered.
      Score 1 if it asks about something the transcript already answered
      clearly, or is not a question at all.

      What was said: {prompt}
      Agent response: {response}
      Full trace: {agent_data}

      Return a JSON object with two keys: "score", an integer from 1 to 5,
      and "explanation", one sentence. Return nothing else.
